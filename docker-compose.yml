services:
  macsn:
    build: .
    image: macsn:0.1.0
    container_name: macsn
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3008"
      MACSN_DB_PATH: /app/data/macsn.db
    ports:
      - "3008:3008"
    volumes:
      - /opt/macsn/data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3008/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
